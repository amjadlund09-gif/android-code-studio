plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace '__PACKAGE_NAME__'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId '__PACKAGE_NAME__'
        minSdk __MIN_SDK__        // must be 30 or higher (native code uses AImageDecoder)
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'   // build only 64-bit ARM (4x faster native build); add more ABIs if needed
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/*.version', '/DebugProbesKt.bin', '/kotlin-tooling-metadata.json']
        }
    }

    buildFeatures {
        prefab true               // needed for find_package(game-activity)
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '4.1.2'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.games.activity
}
