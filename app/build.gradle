plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.mynative.androidide'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.example.mynative.androidide'
        minSdk 23
        targetSdk 28   // must be <= 28 so the app can exec the JDK it downloads (Android 10+ W^X rule)
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'   // build only 64-bit ARM (much faster native build)
        }
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '4.1.2'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true   // Sora TextMate needs java.time / newer APIs on minSdk 23
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation 'org.tukaani:xz:1.10'   // .deb data.tar.xz for the JDK installer
    implementation 'org.eclipse.jgit:org.eclipse.jgit:5.13.3.202401111512-r'   // Git (last JGit line that runs on Android)
    implementation 'org.slf4j:slf4j-nop:1.7.36'                                // silence JGit's logger

    // Pro editor engine (Sora Editor + TextMate grammars from assets/textmate)
    implementation 'io.github.rosemoe:editor:0.24.6'
    implementation 'io.github.rosemoe:language-textmate:0.24.6'
    implementation 'io.github.rosemoe:oniguruma-native:0.24.6'   // same regex engine as VS Code (faster highlighting)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
